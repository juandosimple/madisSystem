name: Instalador Windows

# Se puede disparar a mano desde la pestaña Actions, o al etiquetar una version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej: 1.0.0). Vacío = solo artefactos, sin release"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write        # necesario para crear el release

jobs:
  compilar:
    runs-on: windows-latest          # el runner Windows gratuito de GitHub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Instalar Tesseract
        run: choco install tesseract --no-progress -y

      - name: Preparar Tesseract para empaquetar
        shell: pwsh
        run: |
          $origen  = "C:\Program Files\Tesseract-OCR"
          $destino = "motor\tesseract"

          # robocopy en vez de Copy-Item: el -Exclude de PowerShell combinado
          # con -Recurse no es confiable. Códigos 0-7 de robocopy son éxito.
          robocopy $origen $destino /E /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy falló ($LASTEXITCODE)" }
          $global:LASTEXITCODE = 0

          # El paquete de Chocolatey trae solo inglés. El español se baja
          # explícitamente: si dependiéramos de que venga incluido, la app
          # compilaría bien y el OCR fallaría recién en manos del usuario.
          $spa = "$destino\tessdata\spa.traineddata"
          Invoke-WebRequest -UseBasicParsing -OutFile $spa `
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/spa.traineddata"

          # se podan los demás idiomas, pero NO las subcarpetas configs/ y
          # tessconfigs/, que Tesseract necesita para arrancar.
          Get-ChildItem "$destino\tessdata" -Filter *.traineddata |
            Where-Object { $_.BaseName -notin @("spa", "eng", "osd") } |
            Remove-Item -Force

          # comprobación real: que el binario corra y reconozca el español.
          $env:TESSDATA_PREFIX = (Resolve-Path "$destino\tessdata").Path
          $idiomas = & "$destino\tesseract.exe" --list-langs 2>&1
          Write-Host "Idiomas disponibles: $($idiomas -join ', ')"
          if ($idiomas -notcontains "spa") { throw "Falta el español en Tesseract" }

          Get-ChildItem $destino -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { "Empaquetado: {0} archivos, {1:N1} MB" -f $_.Count, ($_.Sum/1MB) }

      - name: Probar que el OCR funciona
        shell: pwsh
        run: |
          # Fabrica un formulario escaneado de mentira y verifica que el motor
          # lo lea. Sin esto sabríamos que el .exe arranca, pero no que sirve.
          $env:PATH = "$PWD\motor\tesseract;$env:PATH"
          $env:TESSDATA_PREFIX = "$PWD\motor\tesseract\tessdata"
          python motor/prueba_humo.py

      - name: Compilar con PyInstaller
        run: pyinstaller motor/app.spec --noconfirm --distpath dist --workpath build

      - name: Verificar que el ejecutable arranca
        shell: pwsh
        run: |
          # Arranca el servidor y espera a que responda. Nada de Start-Sleep
          # fijo: el ejecutable descomprime ~75 MB y el arranque varía bastante
          # segun la maquina, asi que un tiempo fijo vuelve el CI inestable.
          $proceso = Start-Process "dist\ExpedientesGEDO\ExpedientesGEDO.exe" -PassThru
          $listo = $false
          foreach ($intento in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                Write-Host "OK: respondió 200 tras $($intento * 2)s"
                $listo = $true
                break
              }
            } catch { }
          }
          Stop-Process -Id $proceso.Id -Force -ErrorAction SilentlyContinue
          if (-not $listo) {
            Write-Host "--- registro de la app ---"
            Get-Content "$env:LOCALAPPDATA\ExpedientesGEDO\registro.txt" -EA SilentlyContinue
            throw "El ejecutable no respondió en 60 segundos"
          }

      - name: Armar el instalador
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}" -replace '^v', '' }
          if (-not $version) { $version = "0.0.0-prueba" }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=$version instalador.iss

      - name: Publicar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: ExpedientesGEDO-instalador
          path: salida/*.exe
          if-no-files-found: error

      - name: Publicar la versión portable
        uses: actions/upload-artifact@v4
        with:
          name: ExpedientesGEDO-portable
          path: dist/ExpedientesGEDO/

      - name: Crear el release
        # solo si se pidió una versión a mano, o si se empujó una etiqueta
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $etiqueta = "v$env:VERSION"
          Compress-Archive -Path "dist\ExpedientesGEDO\*" `
            -DestinationPath "salida\ExpedientesGEDO-$env:VERSION-portable.zip" -Force

          $notas = @"
          ## Instalación

          Bajá **ExpedientesGEDO-$env:VERSION-instalador.exe** y ejecutalo.

          Windows va a mostrar una advertencia de SmartScreen porque el
          instalador no está firmado: *Más información* -> *Ejecutar de todas
          formas*. Firmarlo requiere un certificado de firma de código.

          La versión portable (.zip) no necesita instalación: se descomprime y
          se ejecuta ExpedientesGEDO.exe.

          Los datos (base, Excel y caché) quedan en la carpeta LOCALAPPDATA del
          usuario, no junto a la aplicación: en Archivos de programa no se puede
          escribir.
          "@

          # se consulta por código de salida y no por la salida de texto, que
          # varía entre versiones de PowerShell
          gh release view $etiqueta *> $null
          $existe = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          $archivos = (Get-ChildItem salida\*).FullName
          if ($existe) {
            gh release upload $etiqueta $archivos --clobber
          } else {
            gh release create $etiqueta $archivos `
              --title "Expedientes GEDO $env:VERSION" --notes $notas
          }
          Write-Host "Release $etiqueta publicado con $($archivos.Count) archivo(s)."
