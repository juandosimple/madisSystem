name: Compilar Windows y macOS

# Se puede disparar a mano desde la pestaña Actions, o al etiquetar una version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej: 1.0.0). Dejar vacío para NO crear release"
        required: false
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write        # necesario para crear el release

jobs:
  # ------------------------------------------------------------- Windows ---
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Instalar Tesseract
        run: choco install tesseract --no-progress -y

      - name: Preparar Tesseract para empaquetar
        shell: pwsh
        run: |
          $origen  = "C:\Program Files\Tesseract-OCR"
          $destino = "motor\tesseract"

          # robocopy en vez de Copy-Item: el -Exclude de PowerShell combinado
          # con -Recurse no es confiable. Códigos 0-7 de robocopy son éxito.
          robocopy $origen $destino /E /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy falló ($LASTEXITCODE)" }
          $global:LASTEXITCODE = 0

          # El paquete de Chocolatey trae solo inglés. El español se baja
          # explícitamente: si dependiéramos de que venga incluido, la app
          # compilaría bien y el OCR fallaría recién en manos del usuario.
          $spa = "$destino\tessdata\spa.traineddata"
          Invoke-WebRequest -UseBasicParsing -OutFile $spa `
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/spa.traineddata"

          # se podan los demás idiomas, pero NO las subcarpetas configs/ y
          # tessconfigs/, que Tesseract necesita para arrancar.
          Get-ChildItem "$destino\tessdata" -Filter *.traineddata |
            Where-Object { $_.BaseName -notin @("spa", "eng", "osd") } |
            Remove-Item -Force

          # comprobación real: que el binario corra y reconozca el español.
          $env:TESSDATA_PREFIX = (Resolve-Path "$destino\tessdata").Path
          $idiomas = & "$destino\tesseract.exe" --list-langs 2>&1
          Write-Host "Idiomas disponibles: $($idiomas -join ', ')"
          if ($idiomas -notcontains "spa") { throw "Falta el español en Tesseract" }

          Get-ChildItem $destino -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { "Empaquetado: {0} archivos, {1:N1} MB" -f $_.Count, ($_.Sum/1MB) }


      - name: Sellar la versión en la app
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}" -replace '^v', '' }
          if (-not $version) { $version = "0.0.0-prueba" }
          $lineas = @(
            '# -*- coding: utf-8 -*-',
            '"""Version de la aplicacion. La escribe el workflow al compilar."""',
            ('VERSION = "' + $version + '"')
          )
          Set-Content -Path motor/version.py -Encoding utf8 -Value $lineas
          Get-Content motor/version.py

      - name: Probar que el OCR funciona
        shell: pwsh
        run: |
          # Fabrica un formulario escaneado de mentira y verifica que el motor
          # lo lea. Sin esto sabríamos que el .exe arranca, pero no que sirve.
          $env:PATH = "$PWD\motor\tesseract;$env:PATH"
          $env:TESSDATA_PREFIX = "$PWD\motor\tesseract\tessdata"
          python motor/prueba_humo.py


      - name: Compilar con PyInstaller
        run: pyinstaller motor/app.spec --noconfirm --distpath dist --workpath build


      - name: Verificar que el ejecutable arranca
        shell: pwsh
        run: |
          # Arranca el servidor y espera a que responda. Nada de Start-Sleep
          # fijo: el ejecutable descomprime ~75 MB y el arranque varía bastante
          # segun la maquina, asi que un tiempo fijo vuelve el CI inestable.
          $proceso = Start-Process "dist\ExpedientesGEDO\ExpedientesGEDO.exe" -PassThru
          $listo = $false
          foreach ($intento in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                Write-Host "OK: respondió 200 tras $($intento * 2)s"
                $listo = $true
                break
              }
            } catch { }
          }
          Stop-Process -Id $proceso.Id -Force -ErrorAction SilentlyContinue
          if (-not $listo) {
            Write-Host "--- registro de la app ---"
            Get-Content "$env:LOCALAPPDATA\ExpedientesGEDO\registro.txt" -EA SilentlyContinue
            throw "El ejecutable no respondió en 60 segundos"
          }


      - name: Armar el instalador
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}" -replace '^v', '' }
          if (-not $version) { $version = "0.0.0-prueba" }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=$version instalador.iss


      - name: Guardar lo compilado
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: salida/*.exe
          if-no-files-found: error

  # --------------------------------------------------------------- macOS ---
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          brew install tesseract tesseract-lang
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Empaquetar Tesseract dentro de la app
        run: |
          # el binario de Homebrew apunta a sus dylib por ruta absoluta: hay que
          # copiar el árbol y reescribir las referencias a @loader_path
          python3 motor/empaquetar_tesseract.py

      - name: Sellar la versión en la app
        run: |
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0-prueba"
          printf '# -*- coding: utf-8 -*-\n"""Version de la aplicacion. La escribe el workflow al compilar."""\nVERSION = "%s"\n' "$VERSION" > motor/version.py
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cat motor/version.py

      - name: Probar que el OCR funciona
        run: |
          # se prueba contra el Tesseract EMPAQUETADO, no el de Homebrew
          PATH="$PWD/motor/tesseract:$PATH" \
          TESSDATA_PREFIX="$PWD/motor/tesseract/tessdata" \
          python3 motor/prueba_humo.py

      - name: Compilar con PyInstaller
        run: pyinstaller motor/app.spec --noconfirm --distpath dist --workpath build

      - name: Verificar que la app arranca
        run: |
          open "dist/Expedientes GEDO.app"
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS http://127.0.0.1:8765/vivo > /dev/null 2>&1; then
              echo "OK: respondió tras $((i * 2))s"; LISTO=1; break
            fi
          done
          pkill -f "Expedientes GEDO" || true
          if [ -z "$LISTO" ]; then
            echo "--- registro ---"; cat ~/.expedientes-gedo/registro.txt || true
            echo "La app no respondió en 60 segundos"; exit 1
          fi

      - name: Armar el .dmg
        run: |
          mkdir -p salida imagen
          cp -R "dist/Expedientes GEDO.app" imagen/
          ln -s /Applications imagen/Aplicaciones     # para arrastrar y soltar
          hdiutil create -volname "Expedientes GEDO" -srcfolder imagen \
            -ov -format UDZO "salida/ExpedientesGEDO-$VERSION.dmg"
          ls -lh salida/

      - name: Guardar lo compilado
        uses: actions/upload-artifact@v5
        with:
          name: mac
          path: salida/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------ publicar ---
  publicar:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: descargas

      - name: Reunir los archivos
        run: |
          mkdir -p salida
          find descargas -type f \( -name "*.exe" -o -name "*.dmg" \) -exec cp {} salida/ \;
          ls -lh salida/

      - name: Crear el release
        if: inputs.version != '' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          ETIQUETA="v$VERSION"
          NOTAS=$(cat <<TEXTO
          ## Instalación

          **Windows:** bajá el archivo \`-instalador.exe\` y ejecutalo. Va a
          aparecer una advertencia de SmartScreen porque no está firmado:
          *Más información* → *Ejecutar de todas formas*.

          **macOS:** bajá el \`.dmg\`, abrilo y arrastrá la app a Aplicaciones.
          La primera vez hay que abrirla con clic derecho → *Abrir*, porque no
          está firmada con una cuenta de desarrollador de Apple.

          Los datos quedan en la carpeta del usuario, no junto a la aplicación.
          TEXTO
          )
          if gh release view "$ETIQUETA" > /dev/null 2>&1; then
            gh release upload "$ETIQUETA" salida/* --clobber
          else
            gh release create "$ETIQUETA" salida/* \
              --title "Expedientes GEDO $VERSION" --notes "$NOTAS"
          fi
          echo "## Release $ETIQUETA publicado" >> $GITHUB_STEP_SUMMARY
          ls salida/ | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

      - name: Avisar si no se publicó release
        if: inputs.version == '' && github.event_name != 'push'
        run: |
          echo "## No se creó ningún Release" >> $GITHUB_STEP_SUMMARY
          echo "El campo Versión quedó vacío: solo hay *artifacts* al pie de esta página." >> $GITHUB_STEP_SUMMARY
